  .btn:hover{transform:translateY(-2px)}
  .btn svg{width:16px;height:16px}
  .arc{position:absolute;left:50%;top:max(620px,74%);width:140vw;max-width:2000px;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;z-index:-1;pointer-events:none;background:#000;box-shadow:0 -30px 140px 10px rgba(255,100,40,.7),0 -8px 40px 0 rgba(255,160,100,.75),inset 0 30px 60px -20px rgba(255,150,90,.55)}
  .glow{position:absolute;inset:0;z-index:-2;background:radial-gradient(60% 45% at 50% 100%,rgba(255,90,31,.3),transparent 70%)}
  .rv{opacity:0;transform:translateY(20px);filter:blur(6px);animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
  @keyframes in{to{opacity:1;transform:none;filter:none}}
  @media (max-width:560px){.arc{width:260vw;top:max(640px,80%)}main{padding-bottom:140px}}
  @media (prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none;filter:none}.check svg{animation:none;stroke-dashoffset:0}}
